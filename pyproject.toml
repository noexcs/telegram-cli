[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-userbot-cli"
version = "0.1.0"
description = "Full-featured Telegram command-line client powered by a Telethon userbot (your own account, not a bot token)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.44,<2",
    "python-dotenv>=1.0",
    "python-socks[asyncio]>=2.4",
    "qrcode>=8.0",
]

[project.scripts]
tg = "tgcli.cli:main"

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/tgcli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
