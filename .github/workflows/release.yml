name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build

      # PyPI publishing is prepared but disabled until the PyPI project is
      # set up (the "telegram-cli" name may be taken). Two options:
      #   1. Trusted Publishing (no secrets needed):
      #      configure the project on PyPI (Publishing → Trusted Publisher)
      #      and uncomment:
      #      - uses: pypa/gh-action-pypi-publish@release/v1
      #        with: { packages-dir: dist/ }
      #   2. API token: add a PYPI_TOKEN secret and uncomment the step below.
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_TOKEN }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
